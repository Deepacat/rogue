			sharpnessPercentPerLevel = 0.1
			sharpnessWhitelist = []
			sharpnessBlacklist = []

		[Enchantments.Vanilla_Overhauls.Infinity]
			#Enable or disable the Infinity enchantment rework.
			enableInfinityOverhaul = true
			#Chance per level to NOT consume a special arrow. (0.16 = 16%)
			#Range: 0.0 ~ 1.0
			specialArrowChancePerLevel = 0.16
			#List of arrows considered 'special'. Modded arrows and Tipped/Spectral are special by default, but you can force standard arrows to be special here.
			specialArrowsList = []
			#List of arrows that are NEVER infinite, even at Level 3. (e.g., 'modid:nuke_arrow')
			arrowBlacklist = []
			#Force-allow Infinity on these WEAPONS. Empty list defaults to Bows and Crossbows.
			infinityWeaponWhitelist = ["minecraft:crossbow"]
			#Explicitly ban Infinity from these WEAPONS.
			infinityWeaponBlacklist = []

		[Enchantments.Vanilla_Overhauls.Frost_Walker]
			#Ice remains frozen even if you stop moving.
			enableStandstill = true
			#Crouching pauses the creation of new ice.
			enableSneak = true
			#Allows walking on powder snow like leather boots.
			enablePowderSnow = true
			#Turns lava into temporary Frosted Magma blocks.
			enableMagma = true
			#Frosted ice melts based on a timer instead of light levels (bypasses vanilla light melting).
			enableLightMeltingTweak = true

